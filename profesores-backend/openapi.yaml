openapi: 3.0.0

info:
  title: API de Profesores UNINPAHU
  description: Microservicio para consultar información de profesores de UNINPAHU.
  version: 1.0.0

servers:
  - url: https://profesores-backend.onrender.com

paths:

  /api/profesores:

    get:

      summary: Consultar profesores

      description: |
        Permite obtener todos los profesores registrados,
        consultar un profesor mediante su ID o buscarlo
        mediante su nombre.

      parameters:

        - name: id
          in: query
          required: false
          description: ID del profesor que se desea consultar.
          schema:
            type: integer
            example: 1

        - name: nombre
          in: query
          required: false
          description: Nombre o parte del nombre del profesor.
          schema:
            type: string
            example: Omar

      responses:

        '200':
          description: Consulta realizada correctamente.

          content:
            application/json:
              schema:
                oneOf:

                  - type: array
                    description: Lista de profesores.
                    items:
                      $ref: '#/components/schemas/Profesor'

                  - $ref: '#/components/schemas/Profesor'

        '400':
          description: El parámetro id no tiene un formato válido.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: El parámetro id debe ser un número

        '404':
          description: No se encontró el profesor solicitado.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Profesor no encontrado

        '500':
          description: Error interno del servidor.

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Error interno del servidor


components:

  schemas:

    Profesor:

      type: object

      properties:

        id:
          type: integer
          example: 1

        nombre:
          type: string
          example: Omar Andrés Bonilla Acosta

        foto:
          type: string
          format: uri
          example: https://uninpahu.edu.co/imagen-profesor.jpg

        formacion:
          type: string
          example: Ingeniero en Sistemas, Electrónica y Telecomunicaciones; Especialización en Seguridad Informática

        profesion:
          type: string
          example: Ingeniero en Sistemas, Electrónica y Telecomunicaciones

        cargo:
          type: string
          example: Docente Líder de Proyectos Integradores de Aula

        area:
          type: string
          example: Sistemas, Seguridad Informática y Proyectos Integradores

    Error:

      type: object

      properties:

        error:
          type: string
          example: Error